<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131314" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Practice">
<title>Practice Honestly</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23131314'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23e5484d'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f5f2;
    --fg: #1b1b1d;
    --muted: #b9b7b1;
    --soft: #77756f;
    --rec: #e5484d;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131314; --fg: #ececea; --muted: #4a4a4d; --soft: #8e8e92; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  main {
    min-height: 100vh; min-height: 100dvh;
    max-width: 560px; margin: 0 auto;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px;
  }
  #time {
    font-size: clamp(44px, 14vw, 68px);
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }
  #time small { font-size: 0.4em; color: var(--soft); font-weight: 300; letter-spacing: 0; }
  #wave {
    width: 100%; height: 96px; display: block;
    touch-action: none; border-radius: 8px; outline-offset: 6px;
  }
  body[data-state="ready"] #wave { cursor: pointer; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 32px; }
  button {
    font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer;
    border-radius: 50%; display: grid; place-items: center;
  }
  button:focus-visible, #wave:focus-visible { outline: 2px solid var(--fg); }
  .side {
    width: 60px; height: 60px;
    transition: opacity .2s, background-color .15s;
  }
  .side:disabled { opacity: .22; cursor: default; }
  .side:not(:disabled):active { background: color-mix(in srgb, var(--fg) 10%, transparent); }
  @media (hover: hover) {
    .side:not(:disabled):hover { background: color-mix(in srgb, var(--fg) 7%, transparent); }
  }
  .side svg { width: 28px; height: 28px; fill: currentColor; }
  #play .i-pause, #play.playing .i-play { display: none; }
  #play.playing .i-pause { display: block; }
  #rec {
    --level: 0;
    width: 92px; height: 92px;
    border: 3px solid var(--fg);
    box-shadow: 0 0 0 calc(var(--level) * 22px) color-mix(in srgb, var(--rec) 22%, transparent);
  }
  #rec .dot {
    width: 68px; height: 68px; border-radius: 50%; background: var(--rec);
    transition: width .18s, height .18s, border-radius .18s, transform .1s;
  }
  #rec:active .dot { transform: scale(.94); }
  body[data-state="recording"] #rec .dot { width: 32px; height: 32px; border-radius: 7px; }
  #hint { min-height: 1.4em; margin: 0; color: var(--soft); font-size: 14px; text-align: center; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body data-state="idle">
<main>
  <div id="time" aria-live="off">0:00</div>

  <canvas id="wave" role="slider" tabindex="-1" aria-label="Playback position"
          aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"></canvas>

  <div class="controls">
    <button id="play" class="side" disabled aria-label="Play">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="4" width="4.5" height="16" rx="1.2"/><rect x="14" y="4" width="4.5" height="16" rx="1.2"/></svg>
    </button>
    <button id="rec" aria-label="Record"><span class="dot"></span></button>
    <button id="share" class="side" disabled aria-label="Share recording">
      <svg viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M12 15V3.5M7.5 7.5 12 3l4.5 4.5M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>
    </button>
  </div>

  <p id="hint" role="status">Tap to record</p>
</main>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const recBtn = $('rec'), playBtn = $('play'), shareBtn = $('share');
  const timeEl = $('time'), hintEl = $('hint'), canvas = $('wave');
  const g = canvas.getContext('2d');

  // Preferred formats: AAC in MP4 (.m4a) plays everywhere; WebM/Ogg are fallbacks.
  const MIMES = ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'];
  const BIN = 0.05; // seconds of audio per waveform sample

  let state = 'idle';           // idle | recording | ready
  let busy = false;             // waiting on mic permission
  let stream = null, ctx = null, analyser = null, buf = null, recorder = null;
  let chunks = [], peaks = [];
  let startedAt = 0, recordedAt = null, measured = 0;
  let blob = null, url = null, wakeLock = null;
  let raf = 0, fixing = false, dragging = false;
  let fallback = 0, failure = '';  // format to fall back to after a failed take, and why it failed

  const audio = new Audio();
  audio.preload = 'auto';

  const fmt = s => {
    s = Math.max(0, Math.floor(s));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };
  const dur = () => (isFinite(audio.duration) && audio.duration > 0 ? audio.duration : measured);
  const say = msg => { hintEl.textContent = msg; };

  // Safari only: tell the system whether we are capturing or just playing, so it
  // leaves the low-quality "call" audio mode as soon as a take is finished.
  const setSession = type => {
    try { if (navigator.audioSession) navigator.audioSession.type = type; } catch (e) { /* optional */ }
  };

  const MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
    (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform)); // iPadOS reports itself as a Mac
  const KEEP_MIC = !MOBILE;

  // Open the page with ?debug to see what the browser actually gave us.
  const DEBUG = /[?&]debug\b/.test(location.search);
  let debugInfo = '';
  if (DEBUG) { hintEl.style.userSelect = hintEl.style.webkitUserSelect = 'text'; hintEl.style.wordBreak = 'break-word'; }
  function collectDebug(track) {
    const s = track.getSettings ? track.getSettings() : {};
    debugInfo = [
      `mic: ${track.label}`,
      `echoCancellation: ${s.echoCancellation}`,
      `autoGainControl: ${s.autoGainControl}`,
      `noiseSuppression: ${s.noiseSuppression}`,
      `voiceIsolation: ${s.voiceIsolation}`,
      `channels: ${s.channelCount}`,
      `rate: ${s.sampleRate} (ctx ${ctx ? ctx.sampleRate : 'n/a'})`,
      `format: ${recorder ? recorder.mimeType : 'n/a'}`,
      `session: ${navigator.audioSession ? navigator.audioSession.type : 'n/a'}`
    ].join(' · ');
  }

  function setState(s) {
    state = s;
    document.body.dataset.state = s;
    const ready = s === 'ready';
    playBtn.disabled = shareBtn.disabled = !ready;
    canvas.tabIndex = ready ? 0 : -1;
    recBtn.setAttribute('aria-label', s === 'recording' ? 'Stop recording' : ready ? 'Record a new take' : 'Record');
    if (s !== 'recording') recBtn.style.setProperty('--level', 0);
    say(debugInfo || (s === 'idle' ? 'Tap to record' : s === 'recording' ? 'Recording' : ''));
    syncPlayButton();
    kick();
  }

  function syncPlayButton() {
    const playing = state === 'ready' && !audio.paused;
    playBtn.classList.toggle('playing', playing);
    playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  }

  // ---------- recording ----------

  const openMic = () => navigator.mediaDevices.getUserMedia({
    // Voice-call processing ruins music: turn all of it off.
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
  });

  function adoptStream(s) {
    stream = s;
    s.getAudioTracks()[0].addEventListener('ended', () => {
      // Mic unplugged or revoked.
      if (state === 'recording') stopRecording(); else releaseMic();
    });
  }

  // A freshly opened mic takes a few seconds to settle to its real level, so on
  // computers open it ahead of time and keep it open while the page is visible.
  async function warmMic() {
    if (!KEEP_MIC || stream || busy || state === 'recording') return;
    if (document.visibilityState !== 'visible') return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) return;
    busy = true;
    if (DEBUG) say(debugInfo = 'early mic open: waiting for the browser');
    try {
      setSession('play-and-record');
      const s = await openMic();
      if (document.visibilityState === 'visible') adoptStream(s);
      else s.getTracks().forEach(t => t.stop());
      if (DEBUG) say(debugInfo = `early mic open: ${stream ? 'ok' : 'skipped, page hidden'}`);
    } catch (e) {
      // The record button reports problems to the user.
      if (DEBUG) say(debugInfo = `early mic open failed: ${e.name}: ${e.message}`);
    }
    busy = false;
  }

  async function startRecording() {
    if (busy) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      say(window.isSecureContext ? 'This browser can’t record audio.' : 'Recording needs HTTPS (or localhost).');
      return;
    }
    busy = true;
    audio.pause();
    // A mic that was opened ahead of time can go dead (sleep, device change):
    // don't record from it, open a fresh one.
    if (stream && !stream.getAudioTracks().some(t => t.readyState === 'live' && !t.muted)) releaseMic();
    // Create the AudioContext inside the tap so iOS lets it run.
    const AC = window.AudioContext || window.webkitAudioContext;
    const newCtx = ctx || (AC ? new AC() : null);
    let newStream = stream;
    if (!newStream) try {
      setSession('play-and-record');
      newStream = await openMic();
    } catch (e) {
      if (newCtx && newCtx !== ctx) newCtx.close();
      setSession(MOBILE ? 'playback' : 'auto');
      busy = false;
      say(e.name === 'NotAllowedError' || e.name === 'SecurityError'
        ? 'Microphone access is blocked. Allow it in your browser settings, then try again.'
        : 'Couldn’t open a microphone.');
      return;
    }
    busy = false;

    // Only now discard the previous take.
    if (url) URL.revokeObjectURL(url);
    audio.removeAttribute('src'); audio.load();
    blob = null; url = null; chunks = []; peaks = [];

    if (stream !== newStream) adoptStream(newStream);
    ctx = newCtx;
    if (ctx) ctx.resume();
    if (ctx && !analyser) {
      analyser = ctx.createAnalyser();
      analyser.fftSize = 2048;
      buf = new Float32Array(analyser.fftSize);
      ctx.createMediaStreamSource(stream).connect(analyser);
    }

    const supported = MIMES.filter(m => MediaRecorder.isTypeSupported(m));
    const mimeType = supported[fallback % (supported.length || 1)];
    failure = '';
    const opts = { audioBitsPerSecond: 192000 };
    if (mimeType) opts.mimeType = mimeType;
    try { recorder = new MediaRecorder(stream, opts); }
    catch (e) { recorder = new MediaRecorder(stream); }
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = finishRecording;
    // An error ends the recording by itself; finishRecording reports it.
    recorder.onerror = e => { failure = (e.error && e.error.name) || 'recorder error'; stopRecording(); };
    recorder.start();
    startedAt = performance.now();
    recordedAt = new Date();
    if (DEBUG) collectDebug(stream.getAudioTracks()[0]);
    setState('recording');

    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* optional */ }
  }

  function releaseMic() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (ctx) ctx.close();
    stream = ctx = analyser = null;
    setSession(MOBILE ? 'playback' : 'auto');
  }

  function stopRecording() {
    if (state !== 'recording' || !recorder || recorder.state === 'inactive') return;
    measured = (performance.now() - startedAt) / 1000;
    recorder.stop();
  }

  function finishRecording() {
    const type = (recorder && recorder.mimeType) || (chunks[0] && chunks[0].type) || 'audio/mp4';
    blob = new Blob(chunks, { type });
    chunks = [];
    recorder = null;
    // On phones and tablets, release the mic so the device switches back to
    // full-quality speaker playback. On computers it stays open (see warmMic).
    const dead = !stream || stream.getAudioTracks().every(t => t.readyState === 'ended');
    if (!KEEP_MIC || dead || document.visibilityState !== 'visible') releaseMic();
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }

    if (!blob.size) {
      // Either the mic sent nothing or the encoder failed. Start the next take
      // with a freshly opened mic and the next format in the list.
      const why = `${failure || 'no data'}, ${type}`;
      fallback++;
      releaseMic();
      debugInfo = '';
      setState('idle');
      say(`Nothing was recorded (${why}). Try again.`);
      return;
    }
    url = URL.createObjectURL(blob);
    audio.src = url;
    setState('ready');
  }

  // ---------- playback ----------

  function togglePlay() {
    if (state !== 'ready') return;
    if (audio.paused) {
      if (audio.ended || audio.currentTime >= dur() - 0.05) audio.currentTime = 0;
      audio.play().catch(() => say('Couldn’t play this recording.'));
    } else {
      audio.pause();
    }
  }

  // Some browsers report Infinity for freshly recorded files; seeking far past
  // the end forces them to work out the real duration.
  audio.addEventListener('loadedmetadata', () => {
    if (audio.duration === Infinity) { fixing = true; audio.currentTime = 1e101; }
  });
  audio.addEventListener('durationchange', () => {
    if (fixing && isFinite(audio.duration)) { fixing = false; audio.currentTime = 0; }
  });
  for (const ev of ['play', 'pause', 'ended', 'seeked', 'durationchange']) {
    audio.addEventListener(ev, () => { syncPlayButton(); kick(); });
  }

  function seekFraction(f) {
    if (state !== 'ready') return;
    audio.currentTime = Math.min(1, Math.max(0, f)) * dur();
    kick();
  }
  function seekFromPointer(e) {
    const r = canvas.getBoundingClientRect();
    seekFraction((e.clientX - r.left) / r.width);
  }
  canvas.addEventListener('pointerdown', e => {
    if (state !== 'ready') return;
    dragging = true;
    canvas.setPointerCapture(e.pointerId);
    seekFromPointer(e);
  });
  canvas.addEventListener('pointermove', e => { if (dragging) seekFromPointer(e); });
  for (const ev of ['pointerup', 'pointercancel']) canvas.addEventListener(ev, () => { dragging = false; });
  canvas.addEventListener('keydown', e => {
    if (state !== 'ready') return;
    const step = e.key === 'ArrowRight' ? 5 : e.key === 'ArrowLeft' ? -5 : 0;
    if (e.key === 'Home') seekFraction(0);
    else if (step) seekFraction((audio.currentTime + step) / dur());
    else return;
    e.preventDefault();
  });

  // ---------- sharing ----------

  async function share() {
    if (!blob) return;
    const type = blob.type.split(';')[0] || 'audio/mp4';
    const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
    const d = recordedAt || new Date(), p = n => String(n).padStart(2, '0');
    const name = `practice-${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.${ext}`;
    const file = new File([blob], name, { type });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; }
      catch (e) { if (e.name === 'AbortError') return; /* otherwise fall through to download */ }
    }
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    say('Saved ' + name);
  }

  // ---------- drawing ----------

  function sampleLevel(elapsed) {
    if (!analyser) return;
    analyser.getFloatTimeDomainData(buf);
    let peak = 0;
    for (let i = 0; i < buf.length; i++) { const v = Math.abs(buf[i]); if (v > peak) peak = v; }
    peak = Math.min(1, peak);
    const idx = Math.floor(elapsed / BIN);
    if (!(peaks[idx] >= peak)) peaks[idx] = peak;
    recBtn.style.setProperty('--level', Math.sqrt(peak).toFixed(3));
  }

  function draw() {
    const w = canvas.width, h = canvas.height;
    const dpr = window.devicePixelRatio || 1;
    const css = getComputedStyle(document.documentElement);
    const cFg = css.getPropertyValue('--fg'), cMuted = css.getPropertyValue('--muted'), cRec = css.getPropertyValue('--rec');
    const pitch = 4 * dpr, bw = 2 * dpr;
    const bars = Math.max(1, Math.floor(w / pitch));
    const n = peaks.length;
    const progress = state === 'ready' && dur() > 0 ? audio.currentTime / dur() : 0;
    g.clearRect(0, 0, w, h);
    for (let i = 0; i < bars; i++) {
      let p = 0;
      if (n) {
        const a = Math.floor(i * n / bars), b = Math.max(a + 1, Math.floor((i + 1) * n / bars));
        for (let j = a; j < b; j++) { const v = peaks[j] || 0; if (v > p) p = v; }
      }
      const bh = Math.max(bw, Math.sqrt(p) * h * 0.95);
      g.fillStyle = state === 'recording' ? cRec : (state === 'ready' && (i + 0.5) / bars <= progress ? cFg : cMuted);
      g.fillRect(i * pitch, (h - bh) / 2, bw, bh);
    }
  }

  function updateTime() {
    if (state === 'recording') {
      timeEl.textContent = fmt((performance.now() - startedAt) / 1000);
    } else if (state === 'ready') {
      const t = fixing ? 0 : audio.currentTime;
      timeEl.innerHTML = `${fmt(t)} <small>/ ${fmt(dur())}</small>`;
      canvas.setAttribute('aria-valuemax', Math.round(dur()));
      canvas.setAttribute('aria-valuenow', Math.round(t));
      canvas.setAttribute('aria-valuetext', `${fmt(t)} of ${fmt(dur())}`);
    } else {
      timeEl.textContent = '0:00';
    }
  }

  function tick() {
    raf = 0;
    if (state === 'recording') sampleLevel((performance.now() - startedAt) / 1000);
    updateTime();
    draw();
    if (state === 'recording' || (state === 'ready' && !audio.paused)) kick();
  }
  function kick() { if (!raf) raf = requestAnimationFrame(tick); }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(canvas.clientWidth * dpr);
    canvas.height = Math.round(canvas.clientHeight * dpr);
    draw();
  }
  new ResizeObserver(resize).observe(canvas);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', kick);

  // ---------- controls ----------

  const toggleRecord = () => (state === 'recording' ? stopRecording() : startRecording());
  recBtn.addEventListener('click', toggleRecord);
  playBtn.addEventListener('click', togglePlay);
  shareBtn.addEventListener('click', share);

  // Keyboard: R = record/stop, Space = stop / play / pause.
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
    if (e.key === 'r' || e.key === 'R') { toggleRecord(); return; }
    if (e.key === ' ' && e.target.tagName !== 'BUTTON') {
      e.preventDefault();
      if (state === 'recording') stopRecording();
      else if (state === 'ready') togglePlay();
      else startRecording();
    }
  });

  // The screen wake lock is dropped when the tab is hidden; take it back if still recording.
  document.addEventListener('visibilitychange', async () => {
    // Don't hold the mic open in a background tab.
    if (document.visibilityState === 'hidden' && state !== 'recording' && !busy) releaseMic();
    if (document.visibilityState === 'visible') warmMic();
    if (document.visibilityState === 'visible' && state === 'recording') {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* optional */ }
    }
  });

  setState('idle');
  warmMic();
})();
</script>
</body>
</html>
